<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Loja de Brinquedos</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="container">
    <h1>Loja de Brinquedos</h1>
    <p class="subtitle">Frontend em container separado consumindo backend Laravel + SQLite.</p>

    <section class="card">
      <h2>Novo brinquedo</h2>
      <form id="toy-form">
        <label>
          Nome
          <input name="name" required maxlength="255" />
        </label>

        <label>
          Descricao
          <textarea name="description" maxlength="1000"></textarea>
        </label>

        <div class="row">
          <label>
            Preco
            <input name="price" type="number" min="0" step="0.01" required />
          </label>

          <label>
            Estoque
            <input name="stock" type="number" min="0" step="1" required />
          </label>
        </div>

        <button type="submit">Salvar</button>
      </form>
    </section>

    <section class="card">
      <h2>Catalogo</h2>
      <button id="refresh-btn" type="button">Atualizar lista</button>
      <ul id="toy-list"></ul>
    </section>
  </main>

  <script src="./app.js"></script>
</body>
</html>
